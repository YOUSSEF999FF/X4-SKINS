plugins {
    id 'com.android.application'
}

// Values come from the GitHub Actions workflow (see .github/workflows/build-user-app.yml)
def vName = System.getenv('VERSION_NAME') ?: '1.0.0'
def vCode = (System.getenv('VERSION_CODE') ?: '1') as int
def ksPath = System.getenv('KEYSTORE_PATH')
def hasKeystore = ksPath != null && file(ksPath).exists()

android {
    namespace 'com.ahmx.x4skins'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ahmx.x4skins18max'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    // Two editions built from the SAME code and the SAME data/*.json:
    //   full = the normal app with all the effects            (com.ahmx.x4skins18max)
    //   lite = no effects at all, for weak phones             (com.ahmx.x4skins18max.lite  -> installs beside the full one)
    // Edition files live in src/full and src/lite (assets/www/edition.js, and for lite: the app name + a green icon).
    flavorDimensions 'edition'
    productFlavors {
        full {
            dimension 'edition'
        }
        lite {
            dimension 'edition'
            applicationIdSuffix '.lite'
        }
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'x4key'
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // no key configured -> temporary debug key (installs fine, but cannot update an app signed with another key)
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'mp4'          // the background video is streamed straight from the APK
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
